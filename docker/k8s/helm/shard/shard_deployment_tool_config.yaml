# Defaults for each namespace memRequestMB is the non-hugepage memory the scheduler
# reserves for a shard. It is set per shard in shard_config above, from measured working
# set over 10 days (2026-09-07 to 2026-09-17 UTC); see values.yaml for the rule. The
# values here apply only to shards with no per-shard entry -- mostly shards that are
# defined but not currently running, so there is no measurement for them.
#
# priorityClassName maps each environment onto the tiers in
# docker/k8s/priority-classes.yml. This is what lets a play shard preempt a volt shard
# instead of sitting Pending when m17 is full.
"namespace_defaults": {
    "play" : { "gsheetCredentials": "true" , "fastMetrics": "false", "maps": "true", "cpuActiveProcessorCount": 2, "cpuLimits": "8", "cpuReqs": "250m", "autoHeapDumpEnabled": "true", "priorityClassName": "monumenta-play" },
    "build": { "gsheetCredentials": "false", "fastMetrics": "false", "maps": "true", "cpuActiveProcessorCount": 2, "cpuLimits": "4", "cpuReqs": "50m", "memRequestMB": 768, "priorityClassName": "monumenta-build" },
    "stage": { "gsheetCredentials": "false", "fastMetrics": "false", "maps": "true", "memRequestMB": 768, "priorityClassName": "monumenta-stage" },
    "volt" : { "gsheetCredentials": "false", "fastMetrics": "false", "maps": "true", "memRequestMB": 768, "priorityClassName": "monumenta-volt" },
}

# Memory values copied directly from /proc/meminfo
#
# CORRECTED 2026-09-17: m18 huge_pages was 85000 here, but the node reports 68000
# (132.81 GiB) in its kubernetes capacity. This file was claiming 33 GiB of hugepages
# that do not exist, so the planning tool would happily place shards that could never be
# scheduled. m17's 175000 matches the live node. If the boot-time allocation in
# /etc/default/grub changes, update this too.
"node_info": {
    "m17":    { "full_name": "monumenta-17",        "mem_total_kB": 528044716, "huge_pages": 175000, "huge_page_size_kB": 2048, "geoDescription": "NA" },
    "m18":    { "full_name": "monumenta-18",        "mem_total_kB": 263971944, "huge_pages":  68000, "huge_page_size_kB": 2048, "geoDescription": "EU" },

    # These are not real hosts and exist purely for planning where to put new shards
    "new":    { "full_name": "monumenta-new",       "mem_total_kB": 528044716, "huge_pages": 175000, "huge_page_size_kB": 2048, "geoDescription": "The Big Bang" },
    "delete": { "full_name": "monumenta-delete-me", "mem_total_kB": 528044716, "huge_pages": 175000, "huge_page_size_kB": 2048, "geoDescription": "Null Island" },
