{{/*
  Hugepage budget for one shard, in MiB.

  Everything the JVM maps with -XX:+UseLargePages comes out of this budget. On
  JDK 21 with G1 and 8M regions -Xlog:pagesize=info reports exactly five
  large-page reservations (the code cache prints as three code heaps, but they
  are one reservation that CodeCache::initialize_heaps splits up):

    Java heap          hugePageMB       -Xmx == -Xms, fully committed by -XX:+AlwaysPreTouch
    G1 mark bitmap     hugePageMB / 64  one bit per 8 bytes of heap
    G1 card table      hugePageMB / 512 one byte per 512 bytes of heap
    G1 block offsets   hugePageMB / 512 one byte per 512 bytes of heap
    JIT code cache     codeCacheMB      -XX:ReservedCodeCacheSize, 240M by default on JDK 21

  Regarding code cache: os::can_commit_large_page_memory() is
  false for hugetlbfs, so HotSpot maps large-page reservations in full when it
  reserves them instead of committing them on demand - the entire code cache
  reservation is hugepage backed, whether or not the JIT ever fills it.

  Note that G1's concurrent mark stack is NOT in here - it is normal memory, and
  it is budgeted in memMB below.

  hugePageHeadroomMB is mostly margin. The card table and block offset table
  each round up to a whole 2Mi page independently, so the div-by-256 term above
  can be up to 4Mi light; the rest is safety.

  Two different failure modes make it worth keeping:
    - Too little here and the JVM faults past the pod's hugetlb limit. The
      kernel does not OOM-kill for that, it SIGBUSes the faulting thread, so it
      shows up as a random crash long after startup rather than as an OOMKill.
      Note the pod's hugetlb cgroup is charged at fault time, so the code cache
      is only charged as the JIT touches it - but the node's hugepage pool is
      committed at mmap time, which is why the full reservation belongs in the
      k8s request.
    - If the node's pool cannot satisfy the reservation at startup, HotSpot
      silently falls back to 4Ki pages, which moves up to codeCacheMB of the
      budget into memMB instead and OOM-kills the pod.
*/}}
{{- define "shard.hugePageMB" -}}
{{- $raw := add .Values.hugePageMB (div .Values.hugePageMB 64) (div .Values.hugePageMB 256) .Values.codeCacheMB .Values.hugePageHeadroomMB -}}
{{- mul 2 (div (add $raw 1) 2) -}}
{{- end }}

# Service / network ports

apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
{{- if .Values.fastMetrics }}
    k8s-app: monumenta-metrics-fast
{{- else }}
    k8s-app: monumenta-metrics
{{- end }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.name }}
  ports:
  # Main minecraft port
  - name: "25566"
    port: 25566
    targetPort: 25566
  - name: metrics
    port: 9225
    targetPort: 9225
{{- if eq .Values.namespace "build" }}
  - name: jdb
    port: 9000
    targetPort: 9000
{{- end }}

---

# Deployment / the actual running application

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  strategy:
    type: Recreate
  replicas: 0
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - {{ .Values.nodeFull }}
      volumes:
{{- if .Values.gsheetCredentials }}
        - name: gsheet-credentials
          secret:
            secretName: gsheet-credentials
            defaultMode: 0444
{{- end }}
{{- if .Values.maps }}
        - name: nfs-maps
          hostPath:
            path: /nfs/{{ .Values.namespace }}/maps
            type: Directory
{{- end }}
        - name: nfs-project-epic
          hostPath:
            path: /nfs/{{ .Values.namespace }}/{{ .Values.node }}
            type: Directory
        - name: nfs-domain-shared
          hostPath:
            path: /nfs/3_DOMAIN_SHARED/{{ .Values.namespace }}
            type: Directory
        - name: nfs-shared
          hostPath:
            path: /nfs/4_SHARED
            type: Directory
        - name: nfs-scratch
          hostPath:
            path: /nfs/5_SCRATCH
            type: Directory
      terminationGracePeriodSeconds: 90
      containers:
      - name: {{ .Values.name }}
{{- if eq .Values.namespace "build" }}
        image: "ghcr.io/teammonumenta/monumenta-automation/{{ .Values.imageJbr }}"
{{- else }}
        image: "ghcr.io/teammonumenta/monumenta-automation/{{ .Values.image }}"
{{- end }}
        tty: true
        stdin: true
        ports:
        - containerPort: 25566
        - containerPort: 8000
        - containerPort: 9225
{{- if eq .Values.namespace "build" }}
        - containerPort: 9000
{{- end }}
        env:
        # Set this to however much RAM the shard needs
        - name: "JAVA_MEM"
          value: "{{ .Values.hugePageMB }}M"
        - name: "JAVA_JAR"
          value: "server.jar"
        - name: "SERVER_DIR"
          value: "/home/epic/{{ .Values.namespace }}/{{ .Values.node }}/{{ .Values.name }}"
        - name: "JAVA_LARGE_PAGES"
          value: "yes"
        - name: "NETWORK_NAMESPACE"
          value: {{ .Values.namespace }}
        - name: "MONUMENTA_NODE"
          value: {{ .Values.node }}
        - name: "MONUMENTA_GEO_DESCRIPTION"
          value: {{ .Values.geoDescription }}
        - name: "NETWORK_RELAY_NAME"
          value: {{ .Values.name }}
        - name: "EXCEPTLOG_INGEST_URL"
          value: "http://exception-logger.{{ .Values.exceptLogIngestDomain | default .Values.namespace }}/ingest"
        - name: "EXCEPTLOG_SERVER_NAME"
          value: {{ .Values.name }}
        - name: "HEAPLOG_INGEST_URL"
          value: "http://heap-logger.default.svc.cluster.local:8081/ingest"
        - name: "HEAPLOG_AUTO_DUMP"
          value: "{{ .Values.autoHeapDumpEnabled }}"
        - name: "NETWORK_RELAY_SERVER_ADDRESS"
          value: "{{ .Values.name }}:25566"
{{- if eq .Values.namespace "build" }}
        - name: "JAVA_ARG"
          value: "-XX:ActiveProcessorCount={{ .Values.cpuActiveProcessorCount }} -DPaper.IgnoreJavaVersion=true -Ddisable.watchdog=true -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:9000 -Dlog4j2.configurationFile=log4j2-shard.xml -XX:+AllowEnhancedClassRedefinition"
{{- else if eq .Values.namespace "stage" }}
        - name: "JAVA_ARG"
          value: "-XX:ActiveProcessorCount={{ .Values.cpuActiveProcessorCount }} -DPaper.IgnoreJavaVersion=true -Dlog4j2.configurationFile=log4j2-shard.xml"
{{- else if eq .Values.namespace "volt" }}
        - name: "JAVA_ARG"
          value: "-XX:ActiveProcessorCount={{ .Values.cpuActiveProcessorCount }} -DPaper.IgnoreJavaVersion=true -Dlog4j2.configurationFile=log4j2-shard.xml"
{{- else if eq .Values.namespace "play" }}
        - name: "JAVA_ARG"
          value: "-XX:ActiveProcessorCount={{ .Values.cpuActiveProcessorCount }} -DPaper.IgnoreJavaVersion=true -Dlog4j2.configurationFile=log4j2-shard.xml"
{{- end }}
        - name: "MONUMENTA_IS_PLAY"
{{- if eq .Values.namespace "play" }}
          value: "1"
{{- else if eq .Values.namespace "stage" }}
          value: "1"
{{- else if eq .Values.namespace "volt" }}
          value: "1"
{{- else }}
          value: "0"
{{- end }}
        - name: "MONUMENTA_ENABLE_TIME_WARP"
{{- if eq .Values.namespace "play" }}
          value: "0"
{{- else }}
          value: "1"
{{- end }}
{{- if .Values.useHTTPForProbes }}
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /alive
            port: 8000
          initialDelaySeconds: 360
          timeoutSeconds: 5
          failureThreshold: 7 # if shard does not respond for 70s (failureThreshold * periodSeconds), kill
          periodSeconds: 10
{{- else if .Values.useSocketForProbes }}
        readinessProbe:
          tcpSocket:
            port: 25566
          initialDelaySeconds: 5
          timeoutSeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 25566
          initialDelaySeconds: 360
          timeoutSeconds: 5
          failureThreshold: 7 # if shard does not respond for 70s (failureThreshold * periodSeconds), kill
          periodSeconds: 10
{{- end }}
        volumeMounts:
        - name: nfs-project-epic
          mountPath: /home/epic/{{ .Values.namespace }}/{{ .Values.node }}
{{- if .Values.gsheetCredentials }}
        - name: gsheet-credentials
          mountPath: /home/epic/{{ .Values.namespace }}/{{ .Values.node }}/{{ .Values.name }}/plugins/ScriptedQuests/gsheet_credentials.json
          subPath: gsheet_credentials.json
{{- end }}
{{- if .Values.maps }}
{{- if eq .Values.namespace "stage" }}
        - name: nfs-maps
          mountPath: /home/epic/maps/dynmap/play
{{- else if eq .Values.namespace "volt" }}
        - name: nfs-maps
          mountPath: /home/epic/maps/dynmap/play
{{- else }}
        - name: nfs-maps
          mountPath: /home/epic/maps/dynmap/{{ .Values.namespace }}
{{- end }}
{{- end }}
        - name: nfs-domain-shared
          mountPath: /home/epic/3_DOMAIN_SHARED
        - name: nfs-shared
          mountPath: /home/epic/4_SHARED
        - name: nfs-scratch
          mountPath: /home/epic/5_SCRATCH
        resources:
          limits:
            # Hard ceiling on everything the JVM does NOT keep in hugepages: metaspace,
            # symbol/string tables, thread stacks, Netty direct buffers, G1's C-heap
            # bookkeeping, JIT compiler arenas, glibc malloc arenas, plugin native memory,
            # and the pod's kernel memory. Going over this is an OOM kill.
            # See memMB in values.yaml for the budget behind the number.
            memory: {{ .Values.memMB }}Mi
            # Java heap + G1 side tables + JIT code cache. See the comment at the top of
            # this file for the derivation.
            hugepages-2Mi: {{ include "shard.hugePageMB" . }}Mi
            cpu: {{ .Values.cpuLimits }}
          requests:
            # What a healthy shard actually occupies. This is what the scheduler packs
            # nodes with, so it needs to be a realistic steady-state figure rather than a
            # placeholder - see memRequestMB in values.yaml. Clamped to the limit so
            # that a per-shard memMB override below the default request stays valid.
            memory: {{ min .Values.memRequestMB .Values.memMB }}Mi
            # k8s requires the hugepage request and limit to be equal
            hugepages-2Mi: {{ include "shard.hugePageMB" . }}Mi
            cpu: {{ .Values.cpuReqs }}
