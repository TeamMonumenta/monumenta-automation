# Webhook port for kanboard

apiVersion: v1
kind: Service
metadata:
  name: bug-bot
spec:
  ports:
  - port: 5000
  selector:
    app: bug-bot


---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bug-bot
  labels:
    app: bug-bot
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: bug-bot
  template:
    metadata:
      labels:
        app: bug-bot
    spec:
      priorityClassName: monumenta-infra
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - monumenta-17
      volumes:
        - name: bug-bot-storage
          hostPath:
            type: Directory
            path: /nfs/task-bot/bugs
      containers:
      - name: bug-bot
        image: ghcr.io/teammonumenta/monumenta-automation/monumenta-automation-bot-play
        tty: false
        stdin: false
        volumeMounts:
        - name: bug-bot-storage
          mountPath: /home/epic/.task_bot
        command: ["./discord_bots/task_bot/task_bot.py"]
        resources:
          # 10 days (2026-09-07 to 2026-09-17 UTC): 84 MiB median, 84 MiB peak RSS.
          # Existing values already fit.
          requests:
            cpu: 100m
            memory: 160Mi
          limits:
            cpu: 250m
            memory: 512Mi
