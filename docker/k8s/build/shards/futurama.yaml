---
# Source: Monumenta Java Shard/templates/deployment.yaml
# Deployment / the actual running application

apiVersion: apps/v1
kind: Deployment
metadata:
  name: futurama
  namespace: build
  labels:
    app: futurama
spec:
  strategy:
    type: Recreate
  replicas: 0
  selector:
    matchLabels:
      app: futurama
  template:
    metadata:
      labels:
        app: futurama
    spec:
      priorityClassName: monumenta-build
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - monumenta-18
      volumes:
        - name: nfs-maps
          hostPath:
            path: /nfs/build/maps
            type: Directory
        - name: nfs-project-epic
          hostPath:
            path: /nfs/build/m18
            type: Directory
        - name: nfs-domain-shared
          hostPath:
            path: /nfs/3_DOMAIN_SHARED/build
            type: Directory
        - name: nfs-shared
          hostPath:
            path: /nfs/4_SHARED
            type: Directory
        - name: nfs-scratch
          hostPath:
            path: /nfs/5_SCRATCH
            type: Directory
      terminationGracePeriodSeconds: 90
      containers:
      - name: futurama
        image: "ghcr.io/teammonumenta/monumenta-automation/monumenta-java-shard-25:latest"
        tty: true
        stdin: true
        ports:
        - containerPort: 25566
        # - containerPort: 8000
        - containerPort: 9225
        # - containerPort: 9000
        env:
        # Set this to however much RAM the shard needs
        - name: "JAVA_MEM"
          value: "3072M"
        - name: "JAVA_JAR"
          value: "server.jar"
        - name: "SERVER_DIR"
          value: "/home/epic/build/m18/futurama"
        - name: "JAVA_LARGE_PAGES"
          value: "yes"
        - name: "NETWORK_NAMESPACE"
          value: build
        - name: "NETWORK_RELAY_NAME"
          value: futurama
        - name: "NETWORK_RELAY_SERVER_ADDRESS"
          value: "futurama:25566"
        - name: "JAVA_ARG"
          value: "-Dlog4j2.configurationFile=log4j2-shard.xml"
        - name: "MONUMENTA_IS_PLAY"
          value: "0"
        - name: "MONUMENTA_ENABLE_TIME_WARP"
          value: "1"
        #readinessProbe:
        #  httpGet:
        #    path: /ready
        #    port: 8000
        #  initialDelaySeconds: 10
        #  timeoutSeconds: 5
        #  periodSeconds: 5
        #livenessProbe:
        #  httpGet:
        #    path: /alive
        #    port: 8000
        #  initialDelaySeconds: 360
        #  timeoutSeconds: 5
        #  periodSeconds: 10
        volumeMounts:
        - name: nfs-project-epic
          mountPath: /home/epic/build/m18
        - name: nfs-maps
          mountPath: /home/epic/maps/dynmap/build
        - name: nfs-domain-shared
          mountPath: /home/epic/3_DOMAIN_SHARED
        - name: nfs-shared
          mountPath: /home/epic/4_SHARED
        - name: nfs-scratch
          mountPath: /home/epic/5_SCRATCH
        resources:
          limits:
            # LEFT AT 4Gi ON PURPOSE. The old note said "TEMP: avoid OOMkilling the
            # copy_world on blue", and copy_world.py moved in-plugin in Sep 2026, so the
            # original reason is gone. But the only measurement we have of futurama
            # running -- ~3.8 GiB working set, admittedly from the copy_world era -- is
            # well above the 2048Mi standard shard limit. Cutting to 2048Mi on the
            # theory that the in-plugin change fixed it would be choosing a number
            # against the available data rather than from it. Run it once, measure, then
            # cut.
            memory: 4Gi
            # Hugepages = JAVA_MEM + JAVA_MEM/64 (G1 mark bitmap)
            #                     + JAVA_MEM/256 (card table + block offset table)
            #                     + 240 (JIT code cache, -XX:ReservedCodeCacheSize)
            #                     + 64  (per-mapping 2Mi rounding and margin)
            # rounded up to an even MiB. This replaces the old "JAVA_MEM + 192 + 64 per
            # gigabyte" rule, which had the right shape but the wrong terms -- it only
            # exceeded the real requirement above ~1.1 GiB of heap, which is why small
            # shards crashed on it. This file is hand-maintained; keep it in step with
            # helm/shard/templates/deployment.yaml. JAVA_MEM 3072M: 3072 + 48 + 12 + 240
            # + 64 = 3436Mi (was 3456Mi).
            hugepages-2Mi: 3436Mi
          requests:
            # Was 64Mi. futurama has only ~11 samples in the 10-day window (2026-09-07
            # to 2026-09-17 UTC) (it is rarely running) with a ~3.8 GiB working set
            # while up, which is well above the 2048Mi limit -- but that measurement is
            # from the copy_world era. Starting from the standard build shard request;
            # if it OOMs after the in-plugin change, measure it again rather than
            # assuming the old number.
            memory: 768Mi
            hugepages-2Mi: 3436Mi
