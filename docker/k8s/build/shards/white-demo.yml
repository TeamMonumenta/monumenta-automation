# Service / network ports

apiVersion: v1
kind: Service
metadata:
  name: white-demo
  namespace: build
  labels:
    app: white-demo
spec:
  type: ClusterIP
  selector:
    app: white-demo
  ports:
  # Main minecraft port
  - name: "25566"
    port: 25566
    targetPort: 25566

---

# Service / external network ports

apiVersion: v1
kind: Service
metadata:
  name: white-demo-nodeport
  namespace: build
  labels:
    app: white-demo
spec:
  type: NodePort
  selector:
    app: white-demo
  ports:
  # Main minecraft port
  - name: "25566"
    port: 22222
    nodePort: 22222
    targetPort: 25566

---

# Deployment / the actual running application

apiVersion: apps/v1
kind: Deployment
metadata:
  name: white-demo
  namespace: build
  labels:
    app: white-demo
spec:
  strategy:
    type: Recreate
  replicas: 0
  selector:
    matchLabels:
      app: white-demo
  template:
    metadata:
      labels:
        app: white-demo
    spec:
      priorityClassName: monumenta-build
      # Added: this deployment hostPath-mounts /nfs/build/m18 and requests hugepages,
      # but had no nodeAffinity. monumenta-19 has no hugepage pool, so landing there
      # means Pending forever with a confusing reason.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - monumenta-18
      volumes:
        - name: nfs-project-epic
          hostPath:
            type: Directory
            path: /nfs/build/m18/
      terminationGracePeriodSeconds: 90
      containers:
      - name: white-demo
        image: docker.pkg.github.com/teammonumenta/monumenta-automation/monumenta-java-shard
        tty: true
        stdin: true
        ports:
        - containerPort: 25566
        env:
        # Set this to however much RAM the shard needs
        - name: "JAVA_MEM"
          value: "1536M"
        # Set this to 256M regardless of JAVA_MEM
        - name: "JAVA_META_MEM"
          value: "256M"
        - name: "JAVA_JAR"
          value: "paperclip.jar"
        - name: "SERVER_DIR"
          value: "/home/epic/build/m18/Monumenta Demo - The Halls of Wind and Blood"
        - name: "JAVA_LARGE_PAGES"
          value: "yes"
        volumeMounts:
        - name: nfs-project-epic
          mountPath: /home/epic/build/m18
        resources:
          limits:
            # Raised 1Gi -> 2048Mi to match every other shard. JAVA_META_MEM is set to
            # 256M here but nothing passes -XX:MaxMetaspaceSize, so metaspace is not
            # actually capped at that value.
            memory: 2048Mi
            # Hugepages = JAVA_MEM + JAVA_MEM/64 (G1 mark bitmap)
            #                     + JAVA_MEM/256 (card table + block offset table)
            #                     + 240 (JIT code cache, -XX:ReservedCodeCacheSize)
            #                     + 64  (per-mapping 2Mi rounding and margin)
            # rounded up to an even MiB. This replaces the old "JAVA_MEM + 192 + 64 per
            # gigabyte" rule, which had the right shape but the wrong terms -- it only
            # exceeded the real requirement above ~1.1 GiB of heap, which is why small
            # shards crashed on it. This file is hand-maintained; keep it in step with
            # helm/shard/templates/deployment.yaml. JAVA_MEM 1536M: 1536 + 24 + 6 + 240
            # + 64 = 1870Mi (was 1888Mi).
            hugepages-2Mi: 1870Mi
          requests:
            # Was 64Mi. No measurement in the 2026-09-07 to 2026-09-17 UTC window (not
            # currently running), so this is the build-namespace default rather than a
            # measured value.
            memory: 768Mi
            hugepages-2Mi: 1870Mi
