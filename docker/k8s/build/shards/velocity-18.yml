# Service / internal network ports

apiVersion: v1
kind: Service
metadata:
  name: velocity-18
  namespace: build
  labels:
    app: velocity-18
    k8s-app: monumenta-metrics
spec:
  type: ClusterIP
  selector:
    app: velocity-18
  ports:
  - name: metrics
    port: 9225
    targetPort: 9225

---

# Deployment / the actual running application

apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity-18
  namespace: build
  labels:
    app: velocity-18
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: velocity-18
  template:
    metadata:
      labels:
        app: velocity-18
    spec:
      priorityClassName: monumenta-build
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - monumenta-18
      volumes:
        - name: nfs-volume
          hostPath:
            type: Directory
            path: /nfs/build/m18
      containers:
      - name: velocity-18
        image: ghcr.io/teammonumenta/monumenta-automation/monumenta-java-shard-21
        tty: true
        stdin: true
        ports:
        # Primary Minecraft port
        - containerPort: 25566
          hostPort: 9001
          # hostIP: "37.187.56.103" # The node's external facing IP address
        - containerPort: 9225
        env:
        - name: "JAVA_MEM"
          value: "512M"
        - name: "JAVA_META_MEM"
          value: "128M"
        - name: "JAVA_JAR"
          value: "velocity.jar"
        - name: "SERVER_DIR"
          value: "/home/epic/build/m18/velocity-18"
        - name: "JAVA_LARGE_PAGES"
          value: "yes"
        - name: "NETWORK_RELAY_NAME"
          value: velocity-18
        - name: "ALLOW_PACKETS_PUBLICIZE_CONTENT"
          value: "false"
        - name: "JAVA_ARG"
          value: "-Dvelocity.max-plugin-message-payload-size=2100000"
        readinessProbe:
          tcpSocket:
            port: 25566
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 25566
          initialDelaySeconds: 240
          timeoutSeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: nfs-volume
          mountPath: /home/epic/build/m18
        resources:
          limits:
            # Measured working set: 398 MiB median, 453 MiB peak over 10 days
            # (2026-09-07 to 2026-09-17 UTC). Request was 64Mi, which told the scheduler
            # this pod was free.
            #
            # Hugepages 1024Mi -> 826Mi, per the formula in
            # helm/shard/templates/deployment.yaml:
            #   JAVA_MEM + JAVA_MEM/64 + JAVA_MEM/256 + 240 + 64
            #   = 512 + 8 + 2 + 240 + 64 = 826Mi
            # 1024Mi was above the requirement (unlike stage/volt, which were below it)
            # so this is a trim, not a fix.
            cpu: 4
            memory: 2Gi
            hugepages-2Mi: 826Mi
          requests:
            cpu: 1
            memory: 768Mi
            hugepages-2Mi: 826Mi
