#
# NOTE:
# To generate the maps-auth secret, run these commands:
# htpasswd -c ./auth epic
# kubectl create secret generic maps-auth --from-file auth -n build
# rm auth

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maps
  namespace: build
  annotations:
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: tm-auth
    nginx.ingress.kubernetes.io/auth-realm: "Authentication Required - ok"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - build-maps.playmonumenta.com
  rules:
  - host: build-maps.playmonumenta.com
    http:
      paths:
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: maps
              port:
                number: 80

---

# Service / network ports

apiVersion: v1
kind: Service
metadata:
  name: maps
  namespace: build
  labels:
    app: maps
spec:
  type: ClusterIP
  selector:
    app: maps
  ports:
  - name: "80"
    port: 80
    targetPort: 80

---

# This is the actual deployment, specifying what it should run
#
# This is just a stock nginx webserver with the appropriate directory mounted
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maps
  namespace: build
  labels:
    app: maps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maps
  template:
    metadata:
      labels:
        app: maps
    spec:
      priorityClassName: monumenta-build
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - monumenta-18
      volumes:
        - name: nfs-maps
          hostPath:
            path: /nfs/build/maps
            type: Directory
      containers:
      - name: maps
        image: nginx:stable
        resources:
          # nginx serving static maps off NFS. 10 days (2026-09-07 to 2026-09-17 UTC):
          # 30 MiB median, 32 MiB peak RSS; the working set adds reclaimable page cache.
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            cpu: "1"
            memory: 256Mi
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nfs-maps
          mountPath: /usr/share/nginx/html
          readOnly: true
