# Service / internal network ports

apiVersion: v1
kind: Service
metadata:
  name: velocity-18
  namespace: play
  labels:
    app: velocity-18
    k8s-app: monumenta-metrics
spec:
  type: ClusterIP
  selector:
    app: velocity-18
  ports:
  - name: plan
    port: 8804
    targetPort: 8804
  - name: metrics
    port: 9225
    targetPort: 9225

---

# Deployment / the actual running application

apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity-18
  namespace: play
  labels:
    app: velocity-18
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: velocity-18
  template:
    metadata:
      labels:
        app: velocity-18
    spec:
      priorityClassName: monumenta-play
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - monumenta-18
      volumes:
        - name: nfs-volume
          hostPath:
            path: /nfs/play/m18
            type: Directory
        - name: nfs-scratch
          hostPath:
            type: Directory
            path: /nfs/5_SCRATCH
      containers:
      - name: velocity-18
        image: ghcr.io/teammonumenta/monumenta-automation/monumenta-java-shard-21
        tty: true
        stdin: true
        ports:
        # Primary Minecraft port
        - containerPort: 25566
          hostPort: 25565
          # hostIP: "37.187.56.103" # The node's external facing IP address
        # Votifier
        - containerPort: 8192
          hostPort: 3333
          # hostIP: "37.187.56.103" # The node's external facing IP address
        - containerPort: 9225
        env:
        - name: "JAVA_MEM"
          value: "2G"
        - name: "JAVA_META_MEM"
          value: "256M"
        - name: "JAVA_JAR"
          value: "velocity.jar"
        - name: "SERVER_DIR"
          value: "/home/epic/play/m18/velocity-18"
        - name: "JAVA_LARGE_PAGES"
          value: "yes"
        - name: "JAVA_ARG"
          value: "-Dlog4j2.configurationFile=log4j2-velocity.xml"
        - name: "NETWORK_RELAY_NAME"
          value: velocity-18
        - name: "ALLOW_PACKETS_PUBLICIZE_CONTENT"
          value: "true"
        - name: "PLAN_SERVER_ID"
          value: velocity-18
        - name: "PLAN_SERVER_UUID"
          value: "3d352c3e-66b1-55f7-b398-74bc1f804faa"
        - name: "PLAN_PLUGIN_SERVERNAME"
          value: velocity-18
        readinessProbe:
          tcpSocket:
            port: 25566
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 25566
          initialDelaySeconds: 240
          timeoutSeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: nfs-volume
          mountPath: /home/epic/play/m18
        - name: nfs-scratch
          mountPath: /home/epic/5_SCRATCH
        resources:
          limits:
            # Measured working set: 681 MiB median, 817 MiB peak over 10 days
            # (2026-09-07 to 2026-09-17 UTC).
            cpu: "8"
            memory: 2560Mi
            # Hugepages from the formula in helm/shard/templates/deployment.yaml:
            #   JAVA_MEM + JAVA_MEM/64 + JAVA_MEM/256 + 240 (code cache) + 64
            # rounded up to an even MiB. JAVA_MEM 2G: 2048 + 32 + 8 + 240 + 64 = 2392Mi,
            # PLUS 256Mi of deliberate margin = 2648Mi (was 4608Mi, which was nearly
            # double what the JVM can actually map). See velocity-17.yml for why the two
            # play proxies get margin the shards do not.
            hugepages-2Mi: 2648Mi
          requests:
            cpu: "1"
            memory: 1280Mi
            hugepages-2Mi: 2648Mi
