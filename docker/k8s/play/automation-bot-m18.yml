
# NOTE: This depends on the service account stuff already existing that's set up by automation-bot-17.yaml
# This is just the deployment for the 2nd bot

apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation-bot-m18
  namespace: play
  labels:
    app: automation-bot-m18
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: automation-bot-m18
  template:
    metadata:
      labels:
        app: automation-bot-m18
    spec:
      priorityClassName: monumenta-play
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - monumenta-18
      serviceAccountName: automation-bot-service-account
      volumes:
        - name: nfs-play-m18
          hostPath:
            type: Directory
            path: /nfs/play/m18
        - name: nfs-old-backups
          hostPath:
            type: Directory
            path: /nfs/0_OLD_BACKUPS
        - name: nfs-archive
          hostPath:
            type: Directory
            path: /nfs/1_ARCHIVE
        - name: nfs-domain-shared
          hostPath:
            type: Directory
            path: /nfs/3_DOMAIN_SHARED/play
        - name: nfs-shared
          hostPath:
            type: Directory
            path: /nfs/4_SHARED
        - name: nfs-scratch
          hostPath:
            type: Directory
            path: /nfs/5_SCRATCH
        - name: secret-config
          secret:
            secretName: automation-bot-m18-config
      containers:
      - name: automation-bot
        image: ghcr.io/teammonumenta/monumenta-automation/monumenta-automation-bot-play
        tty: false
        stdin: false
        resources:
          # Unlike the m17 bot this one stays flat: 168 MiB median, 179 MiB peak RSS
          # over 10 days (2026-09-07 to 2026-09-17 UTC), with no maintenance-window
          # spike, because the m18 play shards are not rebuilt the same way. Sized
          # accordingly -- if that ever changes, this will OOM and should be raised to
          # match m17.
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "12"
            memory: 2Gi
        volumeMounts:
        - name: nfs-play-m18
          mountPath: /home/epic/play/m18
        - name: nfs-old-backups
          mountPath: /home/epic/0_OLD_BACKUPS
          # XXX NOTE
          # 1_ARCHIVE is deliberately not mounted into stage/volt automation bot
          # This is because part of running weekly test updates there is generating backup files
          # and currently those backups would overwrite play server backups made on the same day
          # If you change this to mount in 1_ARCHIVE, you must change the weekly update script as well
        - name: nfs-archive
          mountPath: /home/epic/1_ARCHIVE
        - name: nfs-domain-shared
          mountPath: /home/epic/3_DOMAIN_SHARED
        - name: nfs-shared
          mountPath: /home/epic/4_SHARED
        - name: nfs-scratch
          mountPath: /home/epic/5_SCRATCH
        - name: secret-config
          mountPath: /home/epic/.monumenta_bot
