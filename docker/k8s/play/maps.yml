apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: maps
  namespace: play
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - map.playmonumenta.com
  rules:
  - host: map.playmonumenta.com
    http:
      paths:
        - pathType: Prefix
          path: "/"
          backend:
            service:
              name: maps
              port:
                number: 80

---

# Service / network ports

apiVersion: v1
kind: Service
metadata:
  name: maps
  namespace: play
  labels:
    app: maps
spec:
  type: ClusterIP
  selector:
    app: maps
  ports:
  - name: "80"
    port: 80
    targetPort: 80

---

# This is the actual deployment, specifying what it should run
#
# This is just a stock nginx webserver with the appropriate directory mounted
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maps
  namespace: play
  labels:
    app: maps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: maps
  template:
    metadata:
      labels:
        app: maps
    spec:
      priorityClassName: monumenta-play
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - monumenta-17
      volumes:
        - name: nfs-maps
          hostPath:
            path: /nfs/play/maps
            type: Directory
      containers:
      - name: maps
        image: nginx:stable
        ports:
        - containerPort: 80
        resources:
          # nginx serving static files off NFS. 10 days (2026-09-07 to 2026-09-17 UTC):
          # 49 MiB peak RSS, 60 MiB peak working set (the extra is page cache for the
          # files it serves, which is reclaimable).
          requests:
            cpu: 10m
            memory: 96Mi
          limits:
            cpu: "1"
            memory: 256Mi
        volumeMounts:
        - name: nfs-maps
          mountPath: /usr/share/nginx/html
          readOnly: true
