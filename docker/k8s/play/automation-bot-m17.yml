# This is a service account for the bot's pod to use to talk to the controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: automation-bot-service-account
  namespace: play

---

# This is the permission object that will be attached to the above service account
# This specifies what the pod is allowed to do
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: automation-bot-role
  namespace: play
rules:
  - apiGroups:
      - ""
      - "apps"
    resources:
      - deployments
      # TODO: Don't need this?
      - pods
    verbs:
      - list
      - patch
      # TODO: Don't need this?
      - update

---

# This binds the role to the service account, giving it perms
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: automation-bot-role-binding
  namespace: play
roleRef:
  kind: Role
  name: automation-bot-role
  apiGroup: rbac.authorization.k8s.io
subjects:
 - kind: ServiceAccount
   name: automation-bot-service-account
   namespace: play

---

# This is the actual bot's deployment, specifying what it should run
apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation-bot-m17
  namespace: play
  labels:
    app: automation-bot-m17
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: automation-bot-m17
  template:
    metadata:
      labels:
        app: automation-bot-m17
    spec:
      priorityClassName: monumenta-play
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - monumenta-17
      serviceAccountName: automation-bot-service-account
      volumes:
        - name: nfs-play-m17
          hostPath:
            type: Directory
            path: /nfs/play/m17
        - name: nfs-old-backups
          hostPath:
            type: Directory
            path: /nfs/0_OLD_BACKUPS
        - name: nfs-archive
          hostPath:
            type: Directory
            path: /nfs/1_ARCHIVE
        - name: nfs-domain-shared
          hostPath:
            type: Directory
            path: /nfs/3_DOMAIN_SHARED/play
        - name: nfs-shared
          hostPath:
            type: Directory
            path: /nfs/4_SHARED
        - name: nfs-scratch
          hostPath:
            type: Directory
            path: /nfs/5_SCRATCH
        - name: secret-config
          secret:
            secretName: automation-bot-m17-config
      containers:
      - name: automation-bot
        image: ghcr.io/teammonumenta/monumenta-automation/monumenta-automation-bot-play
        tty: false
        stdin: false
        resources:
          # Bimodal, and the two modes are 200x apart:
          #   idle       203 MiB median, 226 MiB p99 -- this is ~99% of the time
          #   maintenance 43.8 GiB peak RSS (45.5 GiB working set) during the
          #               weekly update window, when the play shards are stopped
          #               and their memory is free
          #
          # So the request describes the idle state (what the scheduler should reserve
          # permanently) and the limit permits the maintenance spike. This is
          # deliberately a wide Burstable band: the resulting high oom_score_adj is
          # correct here. If the node is ever under real pressure while this is
          # inflated, this is exactly the process that should be killed rather than
          # redis or a shard.
          #
          # 56Gi rather than unlimited so a runaway job cannot take the node down. Sized
          # against the WORKING SET peak (45.5 GiB), not the RSS peak (43.8 GiB) -- the
          # cgroup limit acts on working set, so using the RSS number would have left
          # only 5.5% margin rather than the ~10% intended. The peak also grows with
          # world size at every content release, and being OOM killed part-way through
          # rewriting production region files is not a clean abort. Re-measure after big
          # releases. Deliberately NO cpu limit. This container previously had no
          # resources block at all, so it could use the whole node. During the
          # maintenance window m17's 64 cores are otherwise idle and this job is the
          # only thing running; capping it would directly lengthen the window for no
          # benefit. The memory limit is what protects the node.
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 56Gi
        volumeMounts:
        - name: nfs-play-m17
          mountPath: /home/epic/play/m17
        - name: nfs-old-backups
          mountPath: /home/epic/0_OLD_BACKUPS
          # XXX NOTE
          # 1_ARCHIVE is deliberately not mounted into stage/volt automation bot
          # This is because part of running weekly test updates there is generating backup files
          # and currently those backups would overwrite play server backups made on the same day
          # If you change this to mount in 1_ARCHIVE, you must change the weekly update script as well
        - name: nfs-archive
          mountPath: /home/epic/1_ARCHIVE
        - name: nfs-domain-shared
          mountPath: /home/epic/3_DOMAIN_SHARED
        - name: nfs-shared
          mountPath: /home/epic/4_SHARED
        - name: nfs-scratch
          mountPath: /home/epic/5_SCRATCH
        - name: secret-config
          mountPath: /home/epic/.monumenta_bot
