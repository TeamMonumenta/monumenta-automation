# Service / internal network ports

apiVersion: v1
kind: Service
metadata:
  name: velocity-18
  namespace: stage
  labels:
    app: velocity-18
    k8s-app: monumenta-metrics
spec:
  type: ClusterIP
  selector:
    app: velocity-18
  ports:
  - name: monumenta-socket
    port: 9576
    targetPort: 9576
  - name: metrics
    port: 9225
    targetPort: 9225

---

# Deployment / the actual running application

apiVersion: apps/v1
kind: Deployment
metadata:
  name: velocity-18
  namespace: stage
  labels:
    app: velocity-18
spec:
  strategy:
    type: Recreate
  replicas: 0
  selector:
    matchLabels:
      app: velocity-18
  template:
    metadata:
      labels:
        app: velocity-18
    spec:
      priorityClassName: monumenta-stage
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - monumenta-18
      volumes:
        - name: nfs-volume
          hostPath:
            type: Directory
            path: /nfs/stage/m18
      containers:
      - name: velocity-18
        image: ghcr.io/teammonumenta/monumenta-automation/monumenta-java-shard-21
        tty: true
        stdin: true
        ports:
        # Primary Minecraft port
        - containerPort: 25566
          hostPort: 9002
          # hostIP: "37.187.56.103" # The node's external facing IP address
        - containerPort: 9225
        env:
        - name: "JAVA_MEM"
          value: "512M"
        - name: "JAVA_META_MEM"
          value: "128M"
        - name: "JAVA_JAR"
          value: "velocity.jar"
        - name: "SERVER_DIR"
          value: "/home/epic/stage/m18/velocity-18"
        - name: "JAVA_LARGE_PAGES"
          value: "yes"
        - name: "MONUMENTA_WHITELIST"
          value: monumenta.whitelist.beta
        - name: "NETWORK_RELAY_NAME"
          value: velocity-18
        - name: "ALLOW_PACKETS_PUBLICIZE_CONTENT"
          value: "false"
        readinessProbe:
          tcpSocket:
            port: 25566
          initialDelaySeconds: 10
          timeoutSeconds: 5
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: 25566
          initialDelaySeconds: 240
          timeoutSeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: nfs-volume
          mountPath: /home/epic/stage/m18
        resources:
          limits:
            # Non-hugepage memory was 1Gi with a 64Mi request. Measured working set is
            # 920-1009 MiB -- sitting on the limit -- and both volt proxies show
            # last-terminated-reason OOMKilled. Raised to 2560Mi.
            #
            # Hugepages raised 704Mi -> 826Mi. The formula in
            # helm/shard/templates/deployment.yaml gives
            #   JAVA_MEM + JAVA_MEM/64 + JAVA_MEM/256 + 240 + 64
            #   = 512 + 8 + 2 + 240 + 64 = 826Mi
            # so 704Mi was 122Mi short of what the JVM maps with -XX:+UseLargePages.
            #
            # The 1Gi -> 2560Mi raise is what fixes the OOM kills, on its own: a
            # Velocity proxy's Netty direct buffers and thread stacks simply need more
            # than 1 GiB, and the measured 920-1009 MiB was sitting on the old limit.
            #
            # UNRESOLVED, and NOT the justification for the raise: there is a plausible
            # story where the hugepage shortfall contributed, because a JVM that cannot
            # reserve large pages falls back to 4 KiB ones and that memory then lands in
            # the `memory` budget instead. The circumstantial evidence is that
            # build/shards/velocity-18.yml -- same image, same JAVA_MEM 512M, but 1024Mi
            # of hugepages, above the requirement -- uses 453 MiB of normal memory
            # against 994 MiB here. The evidence against is that these pods report
            # OOMKilled, whereas a pod-level hugetlb shortfall charged at fault time
            # would SIGBUS instead. Which of the two happens depends on whether the
            # hugetlb cgroup charges at mmap time or fault time, which cannot be
            # determined without node access. Treat it as unexplained. To settle it on a
            # node:
            #   kubectl logs <pod> | grep -i 'large page'
            #   grep -c 'KernelPageSize:     2048 kB' /proc/<java pid>/smaps
            cpu: "4"
            memory: 2560Mi
            hugepages-2Mi: 826Mi
          requests:
            cpu: "1"
            memory: 1280Mi
            hugepages-2Mi: 826Mi
