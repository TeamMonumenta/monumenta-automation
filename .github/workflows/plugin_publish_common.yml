name: Build and publish master
# This is a common script, so we only listen to workflow_call
on:
  workflow_call:
    inputs:
      working-directory:
        required: false
        type: string
        default: '.'
    secrets:
      MAVEN_TOKEN:
        required: true
# Jobs
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    # Set up JDK
    - name: Set up JDK 21
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: '21'
    # Git config, not sure why this is needed?
    - name: Apply global Git config
      run: |
          git config --global user.name "Monumenta CI"
          git config --global user.email "Monumenta.CI@NotARealEmail.com"
    # No caching for publish - clean build for security
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      with:
        cache-disabled: true
    - name: Git status after setup-gradle
      run: git status
    # Run publishing
    - name: Publish to Monumenta Maven
      working-directory: ${{ inputs.working-directory }}
      env:
        USERNAME: monumenta
        TOKEN: ${{ secrets.MAVEN_TOKEN }}
      run: |
        ./gradlew publish
